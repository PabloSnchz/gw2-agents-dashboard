<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW2 Agents Dashboard</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>🐈 Agentes Dashboard</h1>
            <div class="refresh-controls">
                <button id="btn-refresh" class="btn btn-secondary">🔄 Refrescar</button>
                <label class="toggle-auto-refresh">
                    <input type="checkbox" id="toggle-autorefresh">
                    <span>Auto-refresh (5 min)</span>
                </label>
            </div>
        </header>

        <!-- KPIs (2×2 grid) -->
        <section class="kpi-section">
            <h2>📊 KPIs del Sistema</h2>
            <div id="kpi-grid" class="kpi-grid"></div>
        </section>

        <!-- Agent Cards -->
        <section class="agent-section">
            <h2>👥 Estado del Equipo</h2>
            <div id="agent-cards" class="agent-grid"></div>
        </section>

        <!-- Alerts & Comms (2-columnas) -->
        <section class="alerts-section">
            <h2>⚠️ Alertas & Comunicaciones</h2>
            <div id="alerts-comms" class="alerts-comms-container"></div>
        </section>

        <!-- Comunicaciones Detalladas -->
        <section class="comms-section">
            <h2>💬 Comunicaciones</h2>
            <div id="comms-toolbar" class="comms-toolbar"></div>
            <div id="comms-kpis" class="comms-kpi-grid"></div>
            <div class="comms-table-wrapper">
                <table class="comms-table">
                    <thead>
                        <tr>
                            <th onclick="sortComms('from')">De ↕</th>
                            <th onclick="sortComms('to')">A ↕</th>
                            <th onclick="sortComms('summary')">Pedido ↕</th>
                            <th onclick="sortComms('status')">Estado ↕</th>
                            <th onclick="sortComms('created')">Creado ↕</th>
                            <th onclick="sortComms('updated')">Actualizado ↕</th>
                        </tr>
                    </thead>
                    <tbody id="comms-tbody">
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Comms Detail Modal -->
        <div id="comms-detail-modal" class="modal-overlay" style="display:none;">
            <div class="modal" tabindex="0">
                <div class="modal-header">
                    <h3 id="comms-modal-title">Detalle de comunicación</h3>
                    <button class="modal-close" onclick="closeCommsModal()">✕</button>
                </div>
                <div class="modal-body" id="comms-modal-body"></div>
            </div>
        </div>

        <!-- Logs (Acordeones) -->
        <section class="logs-section">
            <h2>📋 Logs (Acordeones)</h2>
            <div id="accordion-container" class="accordion-container"></div>
        </section>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <p>Monitor de agentes — datos de <a href="https://github.com/PabloSnchz/gw2-wallet-agents" target="_blank">gw2-wallet-agents</a></p>
            <span id="status-bar" class="status-loading"></span>
        </footer>
    </div>

    <!-- marked.js v4 (CDN, no se commitea) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/config.js?v=4"></script>
    <script src="js/fetcher.js?v=4"></script>
    <script src="js/parser.js?v=4"></script>
    <script src="js/renderer.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
</body>
</html>
